<p-tabs [(value)]="activeTab">
	<p-tablist>
		<p-tab value="text">Text</p-tab>
		<p-tab value="image-general">Image (general)</p-tab>
		<p-tab value="image-template">Image + template</p-tab>
	</p-tablist>
	<p-tabpanels>
		<p-tabpanel value="text">
			<app-text-counter-text-mode />
		</p-tabpanel>
		<p-tabpanel value="image-general">
			<div class="p-4 text-sm text-counter-coming-soon">
				Coming in U6 — upload an image and the counter will extract each
				text region for per-row counts.
			</div>
		</p-tabpanel>
		<p-tabpanel value="image-template">
			<div class="p-4 text-sm text-counter-coming-soon">
				Coming in U9 — pick a template per image and validate extracted
				text against the template's field rules.
			</div>
		</p-tabpanel>
	</p-tabpanels>
</p-tabs>
