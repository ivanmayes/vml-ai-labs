@if (visible()) {
	<div
		class="consent-banner flex items-start gap-3 p-3 rounded-md"
		role="status"
		aria-live="polite"
	>
		<i class="pi pi-info-circle consent-banner-icon" aria-hidden="true"></i>
		<div class="flex-1 flex flex-col gap-2">
			<p class="consent-banner-text">
				Uploaded images are sent to our AI vision provider for text
				extraction. Images are not stored after extraction.
			</p>
			<div>
				<p-button
					label="Got it"
					size="small"
					severity="secondary"
					[outlined]="true"
					(onClick)="onAccept()"
				></p-button>
			</div>
		</div>
	</div>
}
